name: CatMaid
version: '${version}'
main: dev.catmaid.CatMaidPlugin
api-version: '26.2'
author: Hayuuka
depend: [Citizens, BetterModel]
softdepend: [CraftEngine]
commands:
  catmaid:
    description: 猫娘女仆主命令
    aliases: [maid, 猫娘]
permissions:
  catmaid.use:
    description: 普通玩家权限（召唤/管理自己的女仆）
    default: true
  catmaid.admin:
    description: 管理员权限
    default: op
