name: CatMaid
version: '${version}'
main: dev.catmaid.CatMaidPlugin
api-version: '26.2'
author: Hayuuka
# 用 softdepend 而非 depend：depend 缺失时 Paper 会以英文报错拒绝加载，
# 就无法满足"缺依赖时自禁用并打印中文原因"的验收项。softdepend 同样保证加载顺序。
softdepend: [Citizens, BetterModel, CraftEngine]
commands:
  catmaid:
    description: 猫娘女仆主命令
    # P10-10.1：不设 aliases。Bukkit 会把别名注册成独立标签，进而派生出
    # /catmaid:女仆 这类带命名空间前缀的入口，玩家会看到好几套命令，帮助里也容易漏写。
    # 唯一入口就是 /catmaid。
permissions:
  catmaid.use:
    description: 普通玩家权限（召唤/管理自己的女仆）
    default: true
  catmaid.admin:
    description: 管理员权限
    default: op
