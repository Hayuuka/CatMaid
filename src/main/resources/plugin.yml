name: CatMaid
version: '${version}'
main: dev.catmaid.CatMaidPlugin
api-version: '26.2'
author: Hayuuka
# 用 softdepend 而非 depend：depend 缺失时 Paper 会以英文报错拒绝加载，
# 就无法满足"缺依赖时自禁用并打印中文原因"的验收项。softdepend 同样保证加载顺序。
softdepend: [Citizens, BetterModel, CraftEngine]
commands:
  catmaid:
    description: 猫娘女仆主命令
    aliases: [maid, 猫娘]
permissions:
  catmaid.use:
    description: 普通玩家权限（召唤/管理自己的女仆）
    default: true
  catmaid.admin:
    description: 管理员权限
    default: op
