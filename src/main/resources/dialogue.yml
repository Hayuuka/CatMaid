# 女仆台词（agent.md 5.5：台词一律走本文件，代码里不写死中文）
#
# 占位符：{name}=女仆名  {owner}=女仆对主人的称呼（默认"主人"）  {item}=物品名
# 每组是列表，说话时随机取一条。
# 改完的效果：/catmaid admin reload（P8）或重启服务器；本阶段重启即可生效。

on_summon:
  - "初次见面，{owner}！我叫{name}，请多指教～"
  - "{owner}，是您唤醒了我吗？喵。"

# 二级键：on_mode_change.<模式名>，模式名与 Maid.Mode 一致
on_mode_change:
  COMBAT:
    - "了解！{owner}请退后，交给我吧！"
    - "剑已就绪……喵！"
  FARM:
    - "今天也来打理田地吧，{owner}。"
    - "除草的时间到了喵～"
  RANCH:
    - "小家伙们，我来喂你们啦～"
  FOLLOW:
    - "我会一直跟着{owner}的。"
    - "请带我去看看外面的世界喵。"
  IDLE:
    - "那我在家等{owner}回来。"

on_feed:
  - "唔、好吃……谢谢{owner}！"
  - "喵呜～还想再吃一口。"

on_hurt:
  - "呀！……没、没事的喵。"
  - "好痛……{owner}，对不起……"

on_death:
  - "对不起……{owner}……我先休息一下……"
  - "啊……头好晕……"

on_revive:
  - "让{owner}担心了，对不起喵……我回来了！"
  - "铃铛里做了个好梦呢。"

on_level_up:
  - "感觉和{owner}的关系又更近了一步喵！"
  - "嘿嘿……最喜欢{owner}了。"

on_level_down:
  - "呜……最近好像有点疏远了呢……"

on_work_done:
  - "今天的农活做完啦！"
  - "收获满满喵～"

on_idle_random:
  - "……在发什么呆呢喵。"
  - "困了……zzZ"
  - "{owner}还不回来吗……"
