# CatMaid 配置（Phase 1）
general:
  max-per-player: 2
  initial-affection: 10
  # 新女仆对主人的默认称呼（可用 /catmaid title 改；台词里的 {owner} 就是这个）
  default-title: 主人

# 女仆模型池：召唤时若未指定模型，从这里随机取一个
# 模型名必须与 plugins/BetterModel/models/ 内的文件名（去扩展名）一致
#
# 目前只启用 foxmaid：这是唯一经过客户端实测确认贴图正确的模型
# （model_src/foxmaid/ 由服主提供）。其余从 TLM 素材自动转换的模型在 BetterModel 上
# 仍有贴图问题，暂停使用，见 docs/api-facts.md 第 14 节。
#
# 美术资源为 CC BY-NC-SA 4.0：仅非商用服可用，须署名 TartaricAcid 与车万女仆项目
models:
  - foxmaid

# 随机名字池，召唤时从中取一个
names:
  - 小铃
  - 汐音

# ---- Phase 8 性能 ----
performance:
  # 全局女仆上限（含铃铛态）。召唤时校验：数量到达上限就拒绝新的召唤。
  # 压测 60 只时注意这里是 >= 判定——第 60 只就会失败，见 docs/api-facts.md 22.3-5
  global-maid-cap: 60
  # 行为 tick 错峰：各 Mode 与名牌跟随按 npcId 取模分摊到不同 tick。
  # 目前实现是无条件错峰（错峰写在五个 Mode 与 NameTagManager 内部），读到 false 只会打一条告警，
  # 键位保留以满足蓝图 P8 的配置形状；真要关掉得改 Mode，见 docs/api-facts.md 第 23 节
  behavior-tick-stagger: true

# 头顶名牌。
# BetterModel 接管原版实体渲染后，原版名牌会一起被隐藏，所以这里用独立的 TextDisplay 悬浮显示。
nametag:
  enabled: true
  scale: 0.8        # 文字缩放，太大挡视线、太小小字看不清
  height: 0.35      # 相对头顶（实体高度之上）的额外抬升

# 跟随模式。距离带：< stop-dist 停下面向主人；stop-dist~start-dist 保持现状；
# > start-dist 开追；> teleport-dist 直接传送到身后。
follow:
  start-dist: 6
  stop-dist: 2.5
  teleport-dist: 40
  speed: 1.15       # Citizens baseSpeed，1.0 约等于玩家步行，1.15 才跟得上走路的玩家

# 待机模式：在 home 周围闲逛
idle:
  wander-radius: 5

# ---- Phase 5 农业模式 ----
# 女仆在中心点周围找成熟作物，走过去收割。每次扫描 17×3×17 格，每 20 tick 一次（按 npcId 错峰）。
farm:
  radius: 8          # 以中心向外扫几格（x/z），y 方向只扫 -1..+1，避免上下乱找
  center: home       # home = 在/家附近干；self = 跟着自己脚下走（适合随身带出去开荒）
  replant: true      # 收割后自动补种（从女仆背包扣 1 个对应种子；没种子就空着）
  crops:             # 允许收割的作物（必须是原版 Ageable 作物，成熟判定靠 age 到顶）
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - NETHER_WART
    - COCOA

# ---- Phase 6 畜牧模式 ----
# 女仆在自身周围（ranch.radius）捡地面产物、给动物配对、剪羊毛、挤奶。
# 捡拾每 10 tick 一次、决策每 30 tick 一次，均按 npcId 错峰。
ranch:
  radius: 8          # 找动物/找掉落物的半径（以女仆脚下为中心）
  pickup: true       # 是否顺手捡地面产物（鸡蛋、羊毛、掉落物）。关掉就只管动物
  # 干活顺序：排前面的先干。没活干时按这个顺序一路找下去
  action-priority: [ BREED, SHEAR, MILK ]
  # 饲料映射：只用来覆盖特例，没写在这里的动物由原版判定（Animals#isBreedItem）
  # 繁殖一次要 2 份（一只一份），不够就等她回来看见主人补给
  breed-food:
    COW: WHEAT
    SHEEP: WHEAT
    PIG: CARROT
    CHICKEN: WHEAT_SEEDS

# ---- Phase 4 养成层 ----

# 交互
interaction:
  # 魂符材质（右键召唤）。必须与 /catmaid talisman 发放的物品一致
  talisman-material: AMETHYST_SHARD
  # 魂符自助领取（/catmaid talisman）：关掉后只能由管理员发放
  talisman-enabled: true
  # 自助领取冷却（小时，0 = 不限）。只记在内存里，重启服务器会清零
  talisman-cooldown-hours: 24
  # 喂食冷却：同一只女仆两次喂食的最小间隔
  feed-cooldown-seconds: 60
  # 可喂的食物（手持其中之一右键女仆 = 喂食，而不是开菜单）
  feedable:
    - BREAD
    - COOKED_COD
    - COOKED_SALMON
    - BAKED_POTATO
    - COOKED_BEEF
    - COOKED_PORKCHOP
    - COOKIE
    - CAKE
    - SWEET_BERRIES
    - GLOW_BERRIES

affection:
  # 好感度上下界（喂食/受击/死亡都在这个区间里夹紧）
  min: 0
  max: 100

  # 等级表。min = 进入该档所需好感度（第一档必须 0，且必须递增）；
  # capacity = 该档可用的背包存储格数（最大 36）；damage-bonus = 攻击伤害加成（P7 战斗用）。
  # 档数可增删：等级名在 messages.yml 的 gui.level-<序号>（0 起），
  # 超出的档位没有名字时会显示 "Lv.N"，不会把裸 key 打给玩家。
  levels:
    - {min: 0,  capacity: 27, damage-bonus: 0.0}
    - {min: 20, capacity: 30, damage-bonus: 0.05}
    - {min: 40, capacity: 33, damage-bonus: 0.10}
    - {min: 60, capacity: 36, damage-bonus: 0.15}
    - {min: 80, capacity: 36, damage-bonus: 0.20}

  # 从第几档（0 起）开始，死亡扣的好感减半。默认最后一档（羁绊）
  death-halve-from-level: 4
  # 受击扣好感的最小间隔。火焰/岩浆每 10 tick 跳一次，不节流会把好感放干
  hurt-cooldown-seconds: 5

  # 各原因的增减量
  gain:
    feed: 1.0            # 喂一次
    work-harvest: 0.1    # 收割一次（P5）
    work-breed: 0.1      # 繁殖/剪毛/挤奶一次（P6）
    work-kill: 0.2       # 击杀一只敌怪（P7）
    follow-tick: 0.5     # 跟随时每 follow-tick-interval-seconds 一次
  loss:
    hurt: 0.5            # 受击（hurt-cooldown-seconds 内的多段伤害算一次）
    death: 20.0          # 死亡
  # 跟随多久加一次 follow-tick（秒）。蓝图要求 5 分钟
  follow-tick-interval-seconds: 300

# 台词
dialogue:
  channel: chat          # chat | actionbar
  # 受伤台词冷却（好感扣减的冷却在 affection.hurt-cooldown-seconds）
  hurt-cooldown-seconds: 30
  # 随机待机台词：每 check-interval-seconds 掷一次骰子，chance 概率说一句，
  # 同一只女仆两次之间至少隔 cooldown-seconds
  idle:
    check-interval-seconds: 180
    chance: 0.05
    cooldown-seconds: 300

# 死亡与复活
death:
  # 唤醒铃铛的代价，格式 材质:数量（数量可省略，默认 1）
  revive-cost: DIAMOND:1
  # 铃铛用的物品材质（默认原版钟）。改材质前先确认玩家能拿到该物品
  bell-material: BELL
  # 铃铛掉在地上时是否发光（穿墙可见），方便回头找
  bell-glowing: true

# ---- Phase 7 战斗模式 ----
# 女仆主动索敌近战（远程见 ranged-*）。每 10 tick 决策一次，按 npcId 错峰。
combat:
  radius: 12              # 索敌半径：只找这个范围内的怪
  lose-dist: 20           # 脱战距离：目标跑出这个范围就不再追
  attack-interval-ticks: 20   # 两次出手的最小间隔。剑满蓄约 12.5 tick，20 对斧略欠
  # 远程：主手是弓/弩时保持距离射箭（射程内且有视线才射，否则走近）
  ranged-enabled: true
  ranged-range: 15        # 射程。超过这个距离就走近，15 格外箭下坠明显
  arrow-damage: 5.0       # 箭的基础伤害（不含好感加成）；原版玩家满蓄力箭约 6-9
  # 主人保护：主人被打时，她名下战斗模式的女仆立刻锁定攻击者（她也挨打时同样反击）
  protect-owner: true
  # 女仆血量上限。玩家型 NPC 默认 20 血，不改上限她打不过两只僵尸；
  # 每次实体生成都会重设上限并回满（Citizens 重建实体会把这两样都丢掉）
  maid-max-health: 40

# ---- Phase 9 体验扩展 ----

# 依赖模式（蓝图 P9-9.3）：决定凭证物品（铃铛/魂符）用原版材质还是 CraftEngine 自定义物品。
# 两种模式的物品互相认——切换后玩家手里的旧铃铛/旧魂符不作废（身份认的是 catmaid 自己的 PDC）。
dependency:
  provider: vanilla        # vanilla | craftengine
  craftengine:
    # craftengine 模式下要用 CE 物品 ID。CE 侧没有定义这些 ID 时自动回落原版材质并打一条告警
    bell-id: catmaid:bell
    talisman-id: catmaid:talisman

# 主副手物品显示：BetterModel 接管渲染后原版装备层被模型盖住，主手举剑也看不见。
# 这里把主手/副手物品单独显示出来（盔甲仍不显示——模型自带服装）。
hand-item:
  enabled: true
  # auto = 先试模型手部骨骼，骨骼不可用（没有该骨/该骨没有渲染载体）就退独立展示实体
  # bone = 只用模型骨骼（没挂上就不显示）；display = 只用独立展示实体（位置不跟手臂动画）
  mode: auto
  # 模型里的手部定位骨名。foxmaid 自带 RightHandLocator / LeftHandLocator，
  # 但实测这两根是纯定位骨（没有渲染载体），挂物品看不见 —— 见 docs/api-facts 第 24 节，
  # 现在实际生效的是下面的独立展示实体
  main-bone: RightHandLocator
  off-bone: LeftHandLocator
  # 独立展示实体：缩放与三个几何偏移（手只能靠眼调，观感不对直接改这里，不必重编译）
  display-scale: 0.55
  display-side: 0.32       # 右手往右偏多少格（左手取负）
  display-forward: 0.22    # 往身体正前方偏多少格
  display-height: 1.20     # 离脚底多高
