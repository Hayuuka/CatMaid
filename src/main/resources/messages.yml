# 玩家可见文案统一在此维护（agent.md 5.5）。MiniMessage 格式。
prefix: "<light_purple>[CatMaid]</light_purple> "

no-permission: "<red>你没有权限这样做。"
player-only: "<red>该命令只能由玩家执行。"
player-not-found: "<red>找不到玩家：{player}"
depend-missing: "<red>缺少必需依赖 {name}，猫娘女仆已停止工作。"
model-unknown: "<yellow>模型 {model} 不在 config.yml 的 models 列表里，仍会尝试加载。"
world-unavailable: "<red>服务器没有已加载的世界，无法确定生成位置。"
summon-offline-note: "<gray>玩家 {player} 没有进服记录，按名称创建离线档案。"

summon-success: "<green>已召唤女仆 {name}（属于 {owner}，模型 {model}）。"
summon-max: "<red>该玩家最多只能拥有 {max} 只女仆。"
summon-no-model: "<red>配置里没有任何可用模型，请检查 config.yml 的 models。"
remove-success: "<yellow>已送走女仆 {name}。"
remove-all-success: "<yellow>已送走 {player} 名下的 {count} 只女仆。"
maid-not-found: "<red>找不到这个女仆：{name}"
not-your-maid: "<red>她不是你的女仆哦。"

# 头顶名牌（TextDisplay）。{owner}=主人游戏名（取不到时回落为"主人"） {name}=女仆名（已按等级上色）
nametag:
  format: "<gray>[<white>{owner}</white>]</gray> {name}"
  # 名字颜色随好感度等级变化（0 起：陌生人→熟识→伙伴→挚爱→羁绊）。
  # 档数比等级少时取最后一档；改名后名牌与这里都立即刷新。
  name-colors:
    - "<gray>{name}</gray>"
    - "<white>{name}</white>"
    - "<yellow>{name}</yellow>"
    - "<light_purple>{name}</light_purple>"
    - "<red>{name}</red>"

list-header: "<light_purple>女仆列表（共 {count} 只）："
list-entry: "<gray>- {name} <dark_gray>|</dark_gray> 主人 {owner} <dark_gray>|</dark_gray> {model} <dark_gray>|</dark_gray> 好感 {affection} <dark_gray>|</dark_gray> {state}"
state-alive: "<green>存活"
state-bell: "<gray>铃铛"
state-stored: "<light_purple>魂符中"

help:
  - "<light_purple>猫娘女仆 <dark_gray>—</dark_gray> 当前可用命令："
  - "<gray>/catmaid gui [名字] <dark_gray>—</dark_gray> 打开她的菜单（多只女仆时可用名字指定）"
  - "<gray>/catmaid mode <模式> [名字] <dark_gray>—</dark_gray> 切换她的工作模式"
  - "<gray>/catmaid sethome [名字] <dark_gray>—</dark_gray> 把脚下设为她的家"
  - "<gray>/catmaid info <dark_gray>—</dark_gray> 查看自己女仆的状态"
  - "<gray>/catmaid rename <名字> [原名字] <dark_gray>—</dark_gray> 改名（好感够才行）"
  - "<gray>/catmaid title <称呼> [名字] <dark_gray>—</dark_gray> 改她对你的称呼"
  - "<gray>/catmaid talisman [数量] <dark_gray>—</dark_gray> 领几张空魂符（收纳/放出女仆）"
  - "<gray>/catmaid soul [数量] <dark_gray>—</dark_gray> 领几张未唤醒的魂符（召唤）"
  - "<gray>/catmaid admin summon <玩家> [模型]"
  - "<gray>/catmaid admin list [玩家]"
  - "<gray>/catmaid admin remove <玩家|女仆UUID>"
  - "<gray>/catmaid admin setaffection <女仆UUID> <数值>"
  - "<gray>/catmaid admin reload <dark_gray>—</dark_gray> 重载 config 与台词"
  - "<dark_gray>未唤醒的魂符对地右键 = 召唤；空魂符右键女仆 = 收纳；装着她的魂符右键空地 = 放出；食物右键女仆 = 喂食。"

# 玩家侧命令找不到女仆时的两种提示
no-maid: "<red>你还没有女仆。用未唤醒的魂符召唤一只吧。"
no-maid-nearby: "<red>附近（{radius} 格内）没有你的女仆。"

# ---- Phase 10 多女仆定向 ----
# 给了名字参数但自己名下没有叫这个的
maid-name-not-found: "<red>你的女仆里没有叫「{name}」的。用 /catmaid info 看看她们叫什么。"
# info 列表尾巴上的提示：列表同时是多女仆定向的选名入口
info-target-hint: "<dark_gray>提示：/catmaid gui|mode|sethome|rename|title 可以带上 [名字] 指定操作对象。"

# ---- Phase 8 玩家侧命令 ----
mode-usage: "<red>用法：/catmaid mode <闲置|跟随|战斗|农业|畜牧>"
mode-invalid: "<red>没有这种模式：{mode}（可选：闲置、跟随、战斗、农业、畜牧）"
mode-already: "<gray>{name} 已经是「{mode}」模式了。"
mode-changed: "<green>已把 {name} 的模式换成「{mode}」。"
home-set: "<green>已把 {name} 的家设在 {x}, {y}, {z}。"

info-header: "<light_purple>你的女仆（共 {count} 只）："
info-entry: "<gray>- {name} <dark_gray>|</dark_gray> {mode} <dark_gray>|</dark_gray> 好感 {affection} <dark_gray>|</dark_gray> {state}"

rename-usage: "<red>用法：/catmaid rename <名字> [原名字]"
rename-need-affection: "<red>{name} 还不太愿意：好感度到「{level}」档（{min}）才能改名。"
rename-invalid: "<red>名字要 2-12 个字，且不能含尖括号、& 和 § 这三个字符。"
rename-same: "<gray>她本来就叫这个名字。"
rename-success: "<green>{old} 现在叫 {name} 了。"
# 重名会废掉多女仆定向（名字是唯一把手）
rename-conflict: "<red>你的女仆里已经有叫「{name}」的了，换一个名字吧。"

title-usage: "<red>用法：/catmaid title <称呼>"
title-need-affection: "<red>{name} 还不太愿意：好感度到「{level}」档（{min}）才能改称呼。"
title-invalid: "<red>称呼要 1-12 个字，且不能含尖括号、& 和 § 这三个字符。"
title-success: "<green>{name} 现在叫你「{title}」了。"

# 魂符自助领取的两个闸门（interaction.talisman-enabled / talisman-cooldown-hours）
talisman-disabled: "<gray>服主关掉了魂符的自助领取，找管理员要吧。"
talisman-cooldown: "<gray>魂符还没准备好，大约还要 {minutes} 分钟。"

# admin setaffection
setaffection-usage: "<red>用法：/catmaid admin setaffection <女仆UUID> <数值>"
affection-invalid: "<red>好感度要在 {min} 到 {max} 之间。"
affection-set: "<green>已把 {name} 的好感度设为 {value}。"
reload-done: "<green>配置与台词已重新加载（models 名单与名牌尺寸需要重启才生效）。"

# ---- Phase 9 魂符收纳 ----
talisman-occupied: "<gray>这张魂符里已经装着她了。"
talisman-broken: "<gray>这张魂符里的气息散了。"
talisman-orphan: "<gray>这张魂符已经失去了主人，毫无反应。"
talisman-not-yours: "<gray>魂符毫无反应……"
stored-talisman-name: "<light_purple>装有{name}的魂符"
stored-talisman-lore:
  - "<gray>对着空地右键，就能把她放出来。"
  - "<dark_gray>她一直在这里面等你。"
store-success: "<light_purple>{name} 钻进了魂符里，乖乖等着你。"
store-dead: "<red>{name} 现在只剩一枚铃铛了，先把她唤醒吧。"
store-already: "<gray>{name} 已经在魂符里了。"
store-failed: "<red>{name} 没办法收进魂符，请稍后再试。"
release-success: "<light_purple>{name} 从魂符里出来了！"
release-failed: "<red>放出 {name} 失败了，请稍后再试。"
release-not-stored: "<gray>{name} 不在魂符里。"
release-blocked: "<red>这里放不下她（脚下被挡住、或者在水里），换一块空地吧。"

# ---- Phase 4 养成层 ----
# 台词聊天行的外观：{name}=女仆名 {line}=台词内容（台词本身来自 dialogue.yml）
dialogue:
  chat-format: "<light_purple>[{name}]</light_purple> <gray>»</gray> <white>{line}"

feed-cooldown: "<gray>{name} 刚吃过，过一会儿再喂吧。"
affection-level-up: "<light_purple>{name} 和你的关系变成了「{level}」，背包扩展到 {capacity} 格！"

# 铃铛（倒下后的形态）
bell-name: "<light_purple>{name}的铃铛"
bell-lore:
  - "<gray>她睡着了。"
  - "<gray>拿在手里右键，就能把她叫醒。"
bell-received: "<light_purple>{name} 倒下了……铃铛已放进你的背包。"
bell-orphan: "<gray>这枚铃铛已经失去了主人，毫无反应。"
bell-not-yours: "<gray>铃铛毫无反应……"
bell-already-alive: "<gray>{name} 已经醒着了。"

revive-no-item: "<red>要把她叫醒，需要 {item} × {amount}。"
revive-npc-missing: "<red>{name} 的身体已经找不到了，请联系管理员。"
revive-failed: "<red>唤回 {name} 失败了，请稍后再试。"
revive-success: "<light_purple>{name} 回来了！"

# 魂符（收纳容器）+ 女仆契约（召唤凭证）——两种物品各管一件事（api-facts 25.2）
talisman-name: "<light_purple>猫娘魂符"
talisman-lore:
  - "<gray>空的时候：对着自己的女仆右键，把她收进来。"
  - "<gray>装着她的时候：对着空地右键，把她放出来。"
  - "<dark_gray>想召唤新的女仆，得用「未唤醒的魂符」。"
talisman-received: "<green>获得 {amount} 张魂符。"
talisman-empty-hint: "<gray>空魂符要对着自己的女仆用：先收人，再对着空地放出来。"

# 未唤醒的魂符 = 会召唤的那一态（TLM 的 smart_slab_init）；用掉后原地变回空魂符
init-talisman-name: "<light_purple>未唤醒的魂符"
init-talisman-lore:
  - "<gray>对着地面右键，唤醒一位猫娘女仆。"
  - "<dark_gray>唤醒之后，这张符就能用来收纳她了。"
init-talisman-used: "<light_purple>{name} 应声醒来，成了你的女仆！"
init-talisman-given: "<light_purple>附赠一张未唤醒的魂符：对着地面右键，她就会来。"
init-talisman-on-maid: "<gray>这张符还没唤醒——先对着地面右键把她放出来。"
init-talisman-not-yours: "<gray>这张魂符认的不是你，毫无反应。"
soul-received: "<green>获得 {amount} 张未唤醒的魂符。"
soul-cooldown: "<gray>新的魂符还没备好，大约还要 {minutes} 分钟。"
soul-disabled: "<gray>服主关掉了未唤醒魂符的自助领取，找管理员要吧。"
summon-blocked: "<red>这里放不下她（脚下两格被挡住），换个地方吧。"
place-only-on-top: "<gray>要对着方块顶面用：站在地上，右键脚边那格。"

# ---- Phase 2 界面文案 ----
gui:
  main-title: "<light_purple>{name} <dark_gray>·</dark_gray> <gray>主菜单"
  backpack-title: "<light_purple>{name} <dark_gray>·</dark_gray> <gray>背包"
  equipment-title: "<light_purple>{name} <dark_gray>·</dark_gray> <gray>装备"
  mode-title: "<light_purple>{name} <dark_gray>·</dark_gray> <gray>模式"
  model-title: "<light_purple>{name} <dark_gray>·</dark_gray> <gray>模型 <dark_gray>({page}/{pages})"

  button-mode: "<yellow>模式选择"
  button-backpack: "<gold>背包管理"
  button-backpack-lore: "<gray>存放 {capacity} 格物品"
  button-equipment: "<aqua>装备管理"
  button-equipment-lore: "<gray>主手 / 副手 / 四件护甲"
  button-model: "<light_purple>模型选择"
  button-model-lore: "<gray>当前模型：<white>{model}"
  button-sit-on: "<green>坐下 <dark_gray>(点一下让她站起来)"
  button-sit-off: "<gray>起立 <dark_gray>(点一下让她坐下)"
  button-back: "<gray>← 返回主菜单"
  button-prev: "<gray>← 上一页"
  button-next: "<gray>下一页 →"

  info-title: "<light_purple>{name}"
  info-lore-top:
    - "<dark_gray>——————————————"
    - "<gray>主人：<white>{owner}"
    - "<gray>称呼：<white>{title}"
    - "<gray>好感度：<light_purple>{affection}<gray> / 100 <dark_gray>({level})"
    - "<gray>模式：<white>{mode}"
  info-equipment-label: "<gray>装备："
  info-equipment-empty: "<dark_gray>未装备"
  info-lore-bottom:
    - "<gray>背包：<white>{used}<gray> / {capacity} 格"
    - "<dark_gray>——————————————"
    - "<gray>击杀 <white>{kills} <gray>· 收割 <white>{harvests} <gray>· 繁殖 <white>{breeds}"
    - "<gray>剪毛 <white>{shears} <gray>· 挤奶 <white>{milks}"

  mode-idle: "闲置"
  mode-follow: "跟随"
  mode-combat: "战斗"
  mode-farm: "农业"
  mode-ranch: "畜牧"
  mode-button: "<gray>{mode}"
  mode-selected: "<green>✔ <white>{mode}"
  mode-current-lore:
    - "<gray>当前模式"

  level-0: "陌生人"
  level-1: "熟识"
  level-2: "伙伴"
  level-3: "挚爱"
  level-4: "羁绊"

  model-entry: "<white>{model}"
  model-selected: "<green>✔ <white>{model}"

  info-stored: "<gray>状态：<light_purple>魂符中<gray>（拿魂符右键可放出）"

  locked-slot: "<dark_gray>未解锁"
  locked-slot-lore:
    - "<gray>提升好感度后开启"

  # 空装备位的位置提示（放进去物品后自动消失）
  slot-mainhand: "<dark_gray>主手"
  slot-offhand: "<dark_gray>副手"
  slot-helmet: "<dark_gray>头盔"
  slot-chest: "<dark_gray>胸甲"
  slot-leggings: "<dark_gray>护腿"
  slot-boots: "<dark_gray>靴子"
  slot-hint-lore:
    - "<gray>把物品放到这一格"

  # 背包界面的说明牌
  help-item: "<yellow>背包说明"
  help-lore:
    - "<gray>最上面一行 6 格：<white>主手 / 副手 / 头盔 / 胸甲 / 护腿 / 靴子"
    - "<gray>下面的格子：<white>随便存东西，共 {capacity} 格"
    - "<gray>灰色玻璃：<white>好感度不够，还没解锁"

  sit-on: "<green>{name} 坐下了。"
  sit-off: "<green>{name} 站起来了。"
  mode-changed: "<green>已把 {name} 的模式换成「{mode}」。"
  model-changed: "<green>已把 {name} 换成模型 {model}。"