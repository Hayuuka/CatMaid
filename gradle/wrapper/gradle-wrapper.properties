distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 本机访问 services.gradle.org 会被 SSL 拒绝，改用腾讯云镜像（同版本，内容一致）。
# 需要官方源时把下面这行换回 https\://services.gradle.org/distributions/gradle-9.9.0-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.9.0-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
